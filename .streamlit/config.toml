# Design der App: Finanz-Look mit zwei Welten. Nachtblau für Kopfzeile, Bühne der Startseite und die
# Depotwert-Karte, helles kühles Grau mit weißen Karten für die Arbeit. Ein Indigo für alles
# Anklickbare, Grün/Rot nur für Gewinne und Verluste, Bernstein nur für überschrittene Grenzen.
# Schrift Inter (liegt in static/fonts und wird von der App selbst ausgeliefert, ohne Google-Server).
# Hell und dunkel: Die App folgt der Systemeinstellung; umschalten lässt sich oben rechts im Menü
# (⋮ → System, Light, Dark). Karten, Abschnittswahl und Startseite gestaltet ui/common.py mit denselben
# Farben (TOKENS); die Diagrammfarben stehen in portfolio_optimizer/charts.py.

[server]
enableStaticServing = true

[theme]
font = "Inter, system-ui, -apple-system, Segoe UI, sans-serif"
headingFont = "Inter, system-ui, -apple-system, Segoe UI, sans-serif"
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"

[theme.light]
primaryColor = "#4352e6"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0d1b33"
linkColor = "#3846d6"
borderColor = "#d5dae6"
dataframeHeaderBackgroundColor = "#f4f6fb"
codeBackgroundColor = "#eef1f7"
greenColor = "#08784e"
redColor = "#cc2338"
orangeColor = "#a85300"
blueColor = "#3846d6"

[theme.dark]
primaryColor = "#5563ee"
backgroundColor = "#090c16"
secondaryBackgroundColor = "#121729"
textColor = "#eef1f8"
linkColor = "#9aa4ff"
borderColor = "#262d45"
dataframeHeaderBackgroundColor = "#1a2036"
codeBackgroundColor = "#1a2036"
greenColor = "#3ddc97"
redColor = "#ff6b7a"
orangeColor = "#ffad42"
blueColor = "#9aa4ff"

[global]
# Seitenübergreifend behaltene Eingaben (ui/common.keep_page_state) sind gewollt
disableWidgetStateDuplicationWarning = true

[client]
# Menü oben rechts nur mit den Punkten für Nutzer (hell/dunkel); Drucken und Bildschirmaufnahme
# blendet ui/common.py aus. Ohne "Deploy"-Knopf und Entwickleroptionen.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
