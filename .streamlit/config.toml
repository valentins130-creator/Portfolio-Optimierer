# Design der App: schlicht wie Apple, im Finance-Look. Helles Grau, weiße Karten, ein Blau für
# alles Anklickbare, Grün/Rot nur für Gewinne und Verluste, Schrift Inter (liegt in static/fonts und
# wird von der App selbst ausgeliefert – ohne Google-Server). Hell und dunkel: Die App folgt der
# Systemeinstellung; umschalten lässt sich oben rechts im Menü (⋮ → System, Light, Dark). Karten,
# Abschnittswahl und Startseite gestaltet ui/common.py mit denselben Farben.

[server]
enableStaticServing = true

[theme]
font = "Inter, system-ui, -apple-system, Segoe UI, sans-serif"
headingFont = "Inter, system-ui, -apple-system, Segoe UI, sans-serif"
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"

[theme.light]
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
dataframeHeaderBackgroundColor = "#f5f5f7"
codeBackgroundColor = "#f5f5f7"
greenColor = "#067a46"
redColor = "#d70015"
orangeColor = "#b25000"

[theme.dark]
primaryColor = "#0071e3"
backgroundColor = "#0a0b0d"
secondaryBackgroundColor = "#16181c"
textColor = "#f5f5f7"
linkColor = "#2997ff"
borderColor = "#2c2f36"
dataframeHeaderBackgroundColor = "#1d2026"
codeBackgroundColor = "#1d2026"
greenColor = "#30d158"
redColor = "#ff453a"
orangeColor = "#ff9f0a"

[global]
# Seitenübergreifend behaltene Eingaben (ui/common.keep_page_state) sind gewollt
disableWidgetStateDuplicationWarning = true

[client]
# Menü oben rechts nur mit den Punkten für Nutzer (hell/dunkel, Drucken),
# ohne "Deploy"-Knopf und Entwickleroptionen
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
